services:
  - type: web
    name: py-factory-gateway
    runtime: python
    region: oregon
    plan: starter
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev python -m factory.gateway.main
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: py-factory-gateway
      - key: RENDER_WORKFLOW_SLUG
        value: py-factory-workflows
      - key: DATABASE_URL
        fromDatabase:
          name: py-factory-db
          property: connectionString

  # DATABASE_URL comes from `uv run setup-render --link-database --apply`.
  - type: workflow
    name: py-factory-workflows
    runtime: python
    region: oregon
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --frozen --no-dev render-workflows factory.workflows.app:app
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: py-factory-workflows
      - key: RENDER_WORKFLOW_SLUG
        value: py-factory-workflows

databases:
  - name: py-factory-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []

envVarGroups:
  - name: py-factory-gateway
    envVars: []
  - name: py-factory-workflows
    envVars: []

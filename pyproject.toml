[project]
name = "py-software-factory"
version = "0.1.0"
description = "A GitHub-native software factory on Render, with Pydantic AI agents in Render Sandboxes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46",
    "fastapi>=0.162",
    "httpx>=0.28",
    "logfire[fastapi,httpx]>=4.39",
    "pydantic>=2.14",
    "pydantic-ai-harness[repair-tool-arguments]==0.68.0",
    "pydantic-ai-slim[anthropic,logfire]==2.68.0",
    "pyyaml>=6.0",
    "pyjwt>=2.10",
    "render==1.8.0",
    "uvicorn>=0.54",
    "psycopg[binary,pool]>=3.3",
]

[project.scripts]
setup-app = "scripts.setup_app:main"
setup-render = "scripts.setup_render:main"
setup-github = "scripts.setup_github:main"
preflight = "scripts.preflight:main"
doctor = "scripts.doctor:main"
db-rebuild = "scripts.db_rebuild:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "scripts"]
only-include = ["factory", "scripts", "factory_config.py"]

[tool.logfire]
# Scripts and tests run without configuring Logfire; their spans are no-ops.
ignore_no_config = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    # Exception names follow the TypeScript factory's (ExpectedFailure).
    "N818",
    # Tests assert; sandbox commands are built from quoted, trusted values.
    "S101",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# Queries join module-level column lists; every value is a bound parameter.
"factory/db/**" = ["S608"]
# Tests drive local git and files from async fakes.
"tests/**" = ["S105", "S106", "S108", "S311", "ASYNC221", "ASYNC240"]

[tool.pyright]
include = ["factory", "scripts", "factory_config.py", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: needs TEST_DATABASE_URL; skipped without it"]
